name: Validate factory workflows

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"

permissions:
  contents: read

jobs:
  validate:
    name: Factory workflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Lint workflows
        shell: bash
        run: |
          asset=actionlint_1.7.12_linux_amd64.tar.gz
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$asset" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$asset"
          cd "$RUNNER_TEMP"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$asset" \
            | sha256sum --check
          tar -xzf "$asset" actionlint
          cd "$GITHUB_WORKSPACE"
          # GitHub exposes both job workflow identity fields. actionlint 1.7.12 predates them.
          "$RUNNER_TEMP/actionlint" -ignore 'property "workflow_(repository|sha)" is not defined in object type'
      - name: Test upstream sync with Git fixtures
        run: node --test .github/scripts/upstream-sync.test.mjs
